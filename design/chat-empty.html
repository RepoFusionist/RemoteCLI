<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LongShell · 空对话</title>
<style>
  :root{
    --bg:#1A1A19;
    --bg-raise:#242423;
    --bg-pill:#2C2C2A;
    --bg-chip:#262625;
    --bg-input:#212120;
    --border:#2C2C2A;
    --border-soft:#242423;
    --text:#ECEAE7;
    --muted:#8F8C86;
    --muted-2:#6E6B66;
    --accent:#E0764E;
    --danger:#C42B1C;
    --sans:"Noto Sans SC","Microsoft YaHei UI","Segoe UI",sans-serif;
    --serif:"Noto Serif SC","Source Han Serif SC",Georgia,serif;
    --r:8px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);font-size:12.5px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
  svg{display:block;flex:none;}

  .app{height:100%;display:grid;grid-template-rows:36px minmax(0,1fr);}

  /* ── 标题栏 ─────────────────────────────── */
  .titlebar{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 6px 0 10px;user-select:none;
  }
  .titlebar__nav{display:flex;align-items:center;gap:2px;}
  .iconbtn{
    width:30px;height:26px;display:grid;place-items:center;border-radius:6px;
    color:var(--muted);
  }
  .iconbtn:hover{background:var(--bg-pill);color:var(--text);}
  .titlebar__win{display:flex;gap:2px;}
  .winbtn{width:38px;height:26px;display:grid;place-items:center;color:var(--muted);border-radius:6px;cursor:default;}
  .winbtn:hover{background:var(--bg-pill);}
  .winbtn--close:hover{background:var(--danger);color:#fff;}

  .body{display:grid;grid-template-columns:206px minmax(0,1fr);min-height:0;}
  .app.side-collapsed .body{grid-template-columns:0 minmax(0,1fr);}
  .app.side-collapsed .side{overflow:hidden;border-right-width:0;}

  /* ── 侧栏 ───────────────────────────────── */
  .side{
    border-right:1px solid var(--border-soft);
    padding:10px 10px 12px;display:flex;flex-direction:column;gap:2px;
    min-width:0;overflow-y:auto;overflow-x:hidden;
  }
  .pills{display:flex;gap:4px;margin-bottom:8px;}
  .pill{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    height:28px;border-radius:var(--r);color:var(--muted);font-size:12px;
  }
  .pill:hover{background:var(--bg-raise);color:var(--text);}
  .pill[aria-selected="true"]{background:var(--bg-pill);color:var(--text);}

  .newchat{
    display:flex;align-items:center;justify-content:space-between;
    height:30px;padding:0 10px;border-radius:var(--r);
    background:var(--bg-pill);color:var(--text);font-size:12.5px;margin-bottom:6px;
  }
  .newchat:hover{background:#333331;}
  .newchat__label{display:flex;align-items:center;gap:8px;}
  .newchat__label svg{color:var(--accent);}
  .newchat kbd{
    font-family:var(--sans);font-size:10.5px;color:var(--muted-2);
    border:1px solid var(--border);border-radius:4px;padding:0 5px;line-height:1.5;
  }

  .link{
    display:flex;align-items:center;gap:9px;height:28px;padding:0 10px;
    border-radius:var(--r);color:var(--muted);font-size:12.5px;width:100%;text-align:left;
  }
  .link:hover{background:var(--bg-raise);color:var(--text);}

  .group{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 10px 4px;color:var(--muted-2);font-size:11.5px;
  }
  .group__tools{display:flex;gap:2px;}
  .group__tools .iconbtn{width:24px;height:22px;}

  .item{
    display:flex;align-items:center;gap:8px;width:100%;
    height:27px;padding:0 10px;border-radius:var(--r);
    color:#C9C6C0;font-size:12.5px;text-align:left;white-space:nowrap;
  }
  .item i{width:3px;height:3px;border-radius:50%;background:var(--accent);opacity:.6;flex:none;}
  .item span{overflow:hidden;text-overflow:ellipsis;}
  .item:hover{background:var(--bg-raise);color:var(--text);}
  .item[aria-current="true"]{background:var(--bg-pill);color:var(--text);}
  .item.is-new span::after{
    content:"新";margin-left:6px;font-size:9.5px;color:var(--accent);
    border:1px solid var(--accent);border-radius:3px;padding:0 3px;line-height:1.4;
    vertical-align:1px;opacity:.9;
  }

  .account{
    margin-top:auto;display:flex;align-items:center;gap:8px;
    padding:8px 10px;border-radius:var(--r);width:100%;text-align:left;
  }
  .account:hover{background:var(--bg-raise);}
  .account .mark{color:var(--accent);}
  .account b{font-weight:500;font-size:12.5px;}
  .account .chev{margin-left:auto;color:var(--muted-2);}

  /* ── 主区 ───────────────────────────────── */
  .main{min-width:0;display:flex;flex-direction:column;}
  .col{
    width:min(600px,88%);margin:0 auto;flex:1;min-height:0;
    display:flex;flex-direction:column;padding:0 20px;
  }
  .greet{
    display:flex;align-items:center;gap:10px;
    margin:64px 0 0;font-family:var(--serif);font-weight:500;
    font-size:20px;letter-spacing:.01em;
  }
  .greet .mark{color:var(--accent);}

  .composer{margin-top:auto;padding:16px 0 14px;}
  .chiprow{position:relative;display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .chip{
    display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;
    border-radius:999px;background:var(--bg-chip);color:var(--muted);font-size:11.5px;
  }
  .chip:hover{color:var(--text);}
  .chip .x{
    display:grid;place-items:center;width:14px;height:14px;border-radius:4px;
    margin-right:-4px;color:var(--muted-2);
  }
  .chip .x:hover{color:var(--accent);background:var(--bg-raise);}
  .chip--add{background:transparent;border:1px dashed var(--border);color:var(--muted-2);}
  .chip--add:hover{color:var(--text);border-color:var(--muted);}
  .mascot{margin-left:auto;color:var(--accent);}

  .menu{
    position:absolute;bottom:calc(100% + 8px);left:0;min-width:190px;
    background:var(--bg-pill);border:1px solid var(--border);border-radius:10px;
    padding:6px;display:none;z-index:30;
  }
  .menu.open{display:block;}
  .menu__title{font-size:11px;color:var(--muted-2);padding:4px 8px 6px;}
  .menu__item{
    display:flex;align-items:center;gap:8px;width:100%;
    padding:7px 8px;border-radius:6px;color:var(--muted);font-size:12px;text-align:left;
  }
  .menu__item:hover{background:var(--bg-raise);color:var(--text);}
  .menu__item .tick{margin-left:auto;color:var(--accent);opacity:0;}
  .menu__item[aria-checked="true"]{color:var(--text);}
  .menu__item[aria-checked="true"] .tick{opacity:1;}

  .inputbox{
    display:flex;align-items:center;gap:10px;
    background:var(--bg-input);border:1px solid var(--border);
    border-radius:12px;padding:9px 8px 9px 14px;
  }
  .inputbox:focus-within{border-color:#3A3A38;}
  .inputbox input{
    flex:1;background:none;border:0;color:var(--text);
    font:inherit;font-size:13px;min-width:0;
  }
  .inputbox input::placeholder{color:var(--muted-2);}
  .inputbox input:focus{outline:none;}
  .send{
    width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    background:var(--bg-pill);color:var(--muted-2);flex:none;
  }
  .send.is-ready{background:var(--accent);color:#241811;}
  .send.is-ready:hover{background:#EA855D;}

  .under{display:flex;align-items:center;gap:4px;margin-top:8px;}
  .under .iconbtn{width:26px;height:24px;}
  .chip--ghost{background:transparent;height:22px;padding:0 8px;}
  .chip--ghost:hover{background:var(--bg-chip);}
  .under__right{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--muted);}
  .model{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;color:var(--muted);font-size:11.5px;}
  .model:hover{background:var(--bg-chip);color:var(--text);}

  .toast{
    position:fixed;left:50%;bottom:120px;transform:translateX(-50%);
    background:var(--bg-pill);border:1px solid var(--border);color:var(--text);
    padding:7px 14px;border-radius:8px;font-size:12px;z-index:50;
    animation:pop .16s ease-out both;
  }
  @keyframes pop{from{opacity:0;transform:translate(-50%,4px);}to{opacity:1;transform:translate(-50%,0);}}

  @media (max-width:760px){
    .body{grid-template-columns:minmax(0,1fr);}
    .side{display:none;}
    .col{width:94%;}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="titlebar">
    <div class="titlebar__nav">
      <button class="iconbtn" id="menuBtn" aria-label="菜单">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
      </button>
      <button class="iconbtn" id="sideBtn" aria-label="收起或展开侧栏">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M6.2 2.5v11"/></svg>
      </button>
      <button class="iconbtn" aria-label="后退">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8H3.5M7 3.8L2.8 8L7 12.2"/></svg>
      </button>
      <button class="iconbtn" aria-label="前进">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h9.5M9 3.8L13.2 8L9 12.2"/></svg>
      </button>
    </div>
    <div class="titlebar__win">
      <button class="winbtn" aria-label="最小化"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1"/></svg></button>
      <button class="winbtn" aria-label="最大化"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.4" y="1.4" width="7.2" height="7.2" rx="1" fill="none" stroke="currentColor"/></svg></button>
      <button class="winbtn winbtn--close" aria-label="关闭"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.6 1.6l6.8 6.8M8.4 1.6L1.6 8.4" stroke="currentColor" stroke-width="1"/></svg></button>
    </div>
  </div>

  <div class="body">

    <aside class="side">
      <div class="pills">
        <button class="pill" aria-selected="false">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M2.5 7.2L8 2.6l5.5 4.6V13a.8.8 0 0 1-.8.8H9.8V9.6H6.2v4.2H3.3a.8.8 0 0 1-.8-.8V7.2z"/></svg>
          首页
        </button>
        <button class="pill" aria-selected="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8.5l3.4 3L6 14.5M12.4 15h5.6" transform="translate(0 -0.5)"/></svg>
          终端
        </button>
      </div>

      <button class="newchat" id="newChatBtn">
        <span class="newchat__label">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
          新建对话
        </span>
        <kbd>Ctrl N</kbd>
      </button>

      <button class="link">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="8" cy="5.4" r="2.6"/><path d="M3 13.4c.7-2.4 2.7-3.6 5-3.6s4.3 1.2 5 3.6"/></svg>
        自定义
      </button>
      <button class="link">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.2" y="2.2" width="11.6" height="11.6" rx="2"/><circle cx="5.6" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="10.4" cy="8" r=".9" fill="currentColor" stroke="none"/></svg>
        更多
      </button>

      <div class="group">
        <span>Chat</span>
        <span class="group__tools">
          <button class="iconbtn" data-add-group="chat" aria-label="在 Chat 中新建对话"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
          <button class="iconbtn" aria-label="搜索会话"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="7" cy="7" r="4.2"/><path d="M13.4 13.4L10.2 10.2"/></svg></button>
          <button class="iconbtn" aria-label="筛选会话"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3 5h10M5 8h6M7 11h2"/></svg></button>
        </span>
      </div>
      <div class="items" data-group-items="chat">
        <button class="item" data-chat><i></i><span>工具调用与命令测试</span></button>
        <button class="item" data-chat><i></i><span>参考作业完成</span></button>
      </div>

      <div class="group">
        <span>longShell</span>
        <span class="group__tools">
          <button class="iconbtn" data-add-group="longshell" aria-label="在 longShell 中新建对话"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
        </span>
      </div>
      <div class="items" data-group-items="longshell">
        <button class="item" data-chat><i></i><span>服务器 SSH 登录与服务状态</span></button>
      </div>

      <div class="group">
        <span>MC</span>
        <span class="group__tools">
          <button class="iconbtn" data-add-group="mc" aria-label="在 MC 中新建对话"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
        </span>
      </div>
      <div class="items" data-group-items="mc">
        <button class="item" data-chat><i></i><span>本地 MCP 连接文件写入测试</span></button>
        <button class="item" data-chat><i></i><span>本地 MCP 文件写入测试</span></button>
        <button class="item" data-chat><i></i><span>网络爬取测试</span></button>
      </div>

      <button class="account">
        <span class="mark">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><path d="M7 9.2l3.2 2.8L7 14.8M12.8 15.2h4.4"/></svg>
        </span>
         <b>用户</b>
        <span class="chev"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg></span>
      </button>
    </aside>

    <main class="main">
      <div class="col">
        <h1 class="greet">
          <span class="mark">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><path d="M7 9.2l3.2 2.8L7 14.8M12.8 15.2h4.4"/></svg>
          </span>
          接下来交给 LongShell 做什么？
        </h1>

        <div class="composer">
          <div class="chiprow" id="chipRow">
            <div class="menu" id="wsMenu" role="menu" aria-label="添加工作区">
              <div class="menu__title">要在这条对话里挂上哪些工作区</div>
            </div>
            <button class="chip chip--add" id="addWsBtn" aria-haspopup="menu" aria-expanded="false">
              <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
              工作区
            </button>
            <span class="mascot">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><path d="M7 9.2l3.2 2.8L7 14.8M12.8 15.2h4.4"/></svg>
            </span>
          </div>

          <div class="inputbox">
            <input id="msgInput" type="text" placeholder="描述任务或提出问题" autocomplete="off" spellcheck="false">
            <button class="send" id="sendBtn" aria-label="发送" disabled>
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5V3.5M4.2 7.3L8 3.5l3.8 3.8"/></svg>
            </button>
          </div>

          <div class="under">
            <button class="iconbtn" aria-label="添加附件">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
            </button>
            <button class="chip chip--ghost" aria-pressed="true" data-mode>自动</button>
            <span class="under__right">
              <button class="model">模型 · 自动</button>
              <button class="model">输出 · 简洁</button>
            </span>
          </div>
        </div>
      </div>
    </main>

  </div>
</div>

<script>
(function(){
  "use strict";
  var $  = function(sel, root){ return (root || document).querySelector(sel); };
  var $$ = function(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  /* ── 侧栏 ─────────────────────────────── */
  $("#sideBtn").addEventListener("click", function(){
    $("#app").classList.toggle("side-collapsed");
  });

  var currentItem = null;
  function selectItem(item){
    $$("[data-chat]").forEach(function(other){ other.removeAttribute("aria-current"); });
    if(item){ item.setAttribute("aria-current", "true"); }
    currentItem = item;
  }
  $$("[data-chat]").forEach(function(item){
    item.addEventListener("click", function(){ selectItem(item); });
  });

  /* 新对话：命名 + 插入分组顶部 + 选中 */
  var nameCounter = 0;
  function nextName(){
    nameCounter += 1;
    return nameCounter === 1 ? "新对话" : "新对话 " + nameCounter;
  }
  function createConversation(groupId){
    var list = $('[data-group-items="' + groupId + '"]');
    if(!list) return null;
    var item = document.createElement("button");
    item.className = "item is-new";
    item.setAttribute("data-chat", "");
    item.setAttribute("title", "预览会话，尚未接入宿主");
    var dot = document.createElement("i");
    var label = document.createElement("span");
    label.textContent = nextName();
    item.appendChild(dot);
    item.appendChild(label);
    list.insertBefore(item, list.firstChild);
    item.addEventListener("click", function(){ selectItem(item); });
    selectItem(item);
    if(item.scrollIntoView){ item.scrollIntoView({ block: "nearest" }); }
    return item;
  }
  $("#newChatBtn").addEventListener("click", function(){
    var group = currentItem && currentItem.closest("[data-group-items]");
    createConversation(group ? group.getAttribute("data-group-items") : "chat");
  });
  $$("[data-add-group]").forEach(function(btn){
    btn.addEventListener("click", function(){ createConversation(btn.getAttribute("data-add-group")); });
  });

  /* ── 工作区芯片 ───────────────────────── */
  var WORKSPACES = [
    { id:"local",     label:"本地",
      icon:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="12" height="8" rx="1.2"/><path d="M5.5 13.4h5" stroke-linecap="round"/></svg>' },
    { id:"longshell", label:"longShell",
      icon:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M8 1.8l5.4 3v6.4l-5.4 3-5.4-3V4.8l5.4-3z"/><path d="M2.9 5l5.1 2.9L13.1 5M8 8v6.8"/></svg>' },
    { id:"mc",        label:"MC",
      icon:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M6.5 2.8v3.4M9.5 2.8v3.4M4 6.2h8v2.6a4 4 0 0 1-8 0V6.2zM8 13.2v-1.8"/></svg>' },
    { id:"remote",    label:"远程服务器",
      icon:'<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.2" y="2.6" width="11.6" height="4.6" rx="1.2"/><rect x="2.2" y="8.8" width="11.6" height="4.6" rx="1.2"/><circle cx="4.9" cy="4.9" r=".8" fill="currentColor" stroke="none"/><circle cx="4.9" cy="11.1" r=".8" fill="currentColor" stroke="none"/></svg>' }
  ];
  var activeWorkspaces = ["local", "longshell"];
  var chipRow = $("#chipRow"), menu = $("#wsMenu"), addBtn = $("#addWsBtn");

  function buildMenu(){
    $$(".menu__item", menu).forEach(function(row){ row.remove(); });
    WORKSPACES.forEach(function(ws){
      var row = document.createElement("button");
      row.className = "menu__item";
      row.setAttribute("role", "menuitemcheckbox");
      row.setAttribute("aria-checked", String(activeWorkspaces.indexOf(ws.id) !== -1));
      row.innerHTML = ws.icon + "<span>" + ws.label + "</span>" +
        '<span class="tick"><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.6L6.4 12L13 4.6"/></svg></span>';
      row.addEventListener("click", function(){
        toggleWorkspace(ws.id);
        buildMenu();
        renderChips();
      });
      menu.appendChild(row);
    });
  }

  function renderChips(){
    $$("[data-ws]", chipRow).forEach(function(chip){ chip.remove(); });
    WORKSPACES.forEach(function(ws){
      if(activeWorkspaces.indexOf(ws.id) === -1) return;
      var chip = document.createElement("span");
      chip.className = "chip";
      chip.setAttribute("data-ws", ws.id);
      chip.innerHTML = ws.icon + "<span>" + ws.label + "</span>";
      var remove = document.createElement("button");
      remove.className = "x";
      remove.setAttribute("aria-label", "移除工作区 " + ws.label);
      remove.innerHTML = '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M1.6 1.6l6.8 6.8M8.4 1.6L1.6 8.4"/></svg>';
      remove.addEventListener("click", function(){
        toggleWorkspace(ws.id);
        buildMenu();
        renderChips();
      });
      chip.appendChild(remove);
      chipRow.insertBefore(chip, addBtn);
    });
  }

  function toggleWorkspace(id){
    var index = activeWorkspaces.indexOf(id);
    if(index === -1){ activeWorkspaces.push(id); }
    else{ activeWorkspaces.splice(index, 1); }
  }

  function closeMenu(){
    menu.classList.remove("open");
    addBtn.setAttribute("aria-expanded", "false");
  }
  addBtn.addEventListener("click", function(){
    var open = !menu.classList.contains("open");
    if(open){ buildMenu(); }
    menu.classList.toggle("open", open);
    addBtn.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("mousedown", function(e){
    if(!menu.classList.contains("open")) return;
    if(!menu.contains(e.target) && e.target !== addBtn && !addBtn.contains(e.target)){ closeMenu(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){ closeMenu(); }
  });

  renderChips();

  /* ── 输入与发送（预览：未接宿主） ─────── */
  var input = $("#msgInput"), send = $("#sendBtn");
  input.addEventListener("input", function(){
    var ready = input.value.trim().length > 0;
    send.disabled = !ready;
    send.classList.toggle("is-ready", ready);
  });
  function toast(message){
    var el = document.createElement("div");
    el.className = "toast";
    el.textContent = message;
    document.body.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2000);
  }
  function trySend(){
    if(!input.value.trim()) return;
    var text = input.value.trim();
    input.value = "";
    input.dispatchEvent(new Event("input"));
    toast("预览文件：『" + text + "』尚未接入宿主");
  }
  send.addEventListener("click", trySend);
  input.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); trySend(); }
  });

  /* Ctrl+N 新建对话 */
  document.addEventListener("keydown", function(e){
    if((e.ctrlKey || e.metaKey) && (e.key === "n" || e.key === "N")){
      e.preventDefault();
      $("#newChatBtn").click();
    }
  });

  /* 模式芯片 */
  $$("[data-mode]").forEach(function(chip){
    chip.addEventListener("click", function(){
      chip.setAttribute("aria-pressed", String(chip.getAttribute("aria-pressed") !== "true"));
    });
  });
})();
</script>
</body>
</html>
