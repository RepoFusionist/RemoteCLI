# Insert inside the API hostname's HTTP and HTTPS server blocks.
# The Relay continues to bind only to host loopback. Port 18085 is private.
location = /remotecli {
    return 308 /remotecli/;
}
location ^~ /remotecli/ {
    proxy_pass http://172.18.0.1:18085/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_intercept_errors off;
}
